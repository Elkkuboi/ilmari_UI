<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#f1ead9">
<title>{{ otsikko }} · Ilmari</title>
<link rel="icon" href="/hub/static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/hub/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/hub/static/icon-192.png">
<link rel="stylesheet" href="/hub/static/app.css">
</head>
<body><a class="skip-link" href="#main">Siirry sisältöön</a>
<header class="top"><div class="wrap"><a class="brand" href="{{ url('/hub') }}">ILMARI</a><nav class="nav" aria-label="Päävalikko">{% for avain, polku, nimi in valikko %}<a href="{{ url(polku) }}"{% if aktiivinen == avain %} aria-current="page"{% endif %}>{{ nimi }}</a>{% endfor %}</nav></div></header>
<main id="main"><div class="wrap">
{% if demo %}<p class="note">Esimerkkitila: keksitty aineisto, napit eivät tee mitään.</p>{% endif %}
{% block sisalto %}{% endblock %}
</div></main>
<footer class="foot"><div class="wrap"><span>Ilmari Hub · {{ ymparisto }}</span><span>Haettu klo {{ haettu }}</span></div></footer>
</body>
</html>
