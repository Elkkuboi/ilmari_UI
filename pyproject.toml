[project]
name = "ilmari-ui"
version = "0.1.0"
description = "Ilmari Hub: turvallinen, palvelinrenderöity lukukäyttöliittymä"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
ilmari-ui = "ilmari_ui.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5"]
browser = ["playwright>=1.51,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: selaimen toiminnalliset ja responsiivisuustestit"]

[tool.hatch.build.targets.wheel]
packages = ["src/ilmari_ui"]
